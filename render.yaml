databases:
  - name: shophub-db
    databaseName: shophub
    user: shophub
    plan: free
    region: singapore

services:
  - type: web
    name: shophub-web
    runtime: python
    plan: free
    region: singapore
    rootDir: mysite
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && gunicorn mysite.wsgi:application --bind 0.0.0.0:$PORT
    initialDeployHook: python manage.py loaddata products
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shophub-db
          property: connectionString
