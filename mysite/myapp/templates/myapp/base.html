<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Store</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <a
          href="{% url 'product_list' %}"
          class="text-2xl font-bold tracking-tight text-indigo-600"
        >
          Shop<span class="text-slate-900">Hub</span>
        </a>
        <nav class="flex items-center space-x-6">
          <a
            href="{% url 'product_list' %}"
            class="text-sm font-medium text-slate-700 hover:text-indigo-600"
            >Products</a
          >
          <a
            href="#"
            class="relative text-slate-700 hover:text-indigo-600"
            id="cart"
          >
            <span
              class="absolute top-0 right-0 inline-flex items-center justify-center h-5 w-5 text-xs font-semibold bg-indigo-600 text-white rounded-full"
              >{% if cart %}{{ cart|length }}{% else %}0{% endif %}</span
            >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
              />
            </svg>
          </a>
          <a href="#" class="relative text-slate-700 hover:text-indigo-600">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
          </a>
        </nav>
      </div>
    </header>

    <!-- Main Body Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      {% block body %} {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
      <div class="max-w-7xl mx-auto px-4 text-center text-sm text-slate-500">
        &copy; {% now "Y" %} ShopHub. All rights reserved.
      </div>
    </footer>
  </body>
</html>
